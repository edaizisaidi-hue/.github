name: sustain

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sustain:
    name: OMEGA Sovereign Sustain Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sovereign Sustain Pulse
        run: |
          echo "=== OMEGA Sustain Cycle Active: $(date) ==="
          if [ -f "main.py" ]; then
              python3 main.py || echo "[!] main.py exited"
          elif [ -f "manager.py" ]; then
              python3 manager.py || echo "[!] manager.py exited"
          else
              echo "Sistem beroperasi pada mod asas."
          fi

      - name: Auto-Commit & Push Integration
        run: |
          git config --global user.name 'Sovereign-Architect-Adaptive'
          git config --global user.email 'architect@system.bot'
          git add . || true
          git commit -m "Adaptive sustain cycle: $(date)" || true
          git push origin main || echo "[!] Push ditolak atau tiada perubahan."
