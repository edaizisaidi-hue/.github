name: sustain

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sustain:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Logik Adaptif Eksekusi Tempatan
        run: |
          echo "[$(date)] OMEGA Sovereign Sustain Cycle Active"
          if [ -f "main.py" ]; then
              python main.py
          elif [ -f "manager.py" ]; then
              python manager.py
          else
              echo "Sistem beroperasi pada mod asas."
          fi

      - name: Auto-Commit & Push Integration
        run: |
          git config --global user.name 'Sovereign-Architect-Adaptive'
          git config --global user.email 'architect@system.bot'
          git add .
          git commit -m "Adaptive sustain cycle: $(date)" || exit 0
          git push origin main || echo "[!] Push ditolak atau tiada perubahan."
